name: CI

# Portão de qualidade em PR. Dois jobs, com pesos diferentes de propósito:
#
#   testes     -> BLOQUEIA o merge. A suíte está 100% verde (18 arquivos, 220
#                 testes), então qualquer vermelho aqui é regressão de verdade.
#
#   qualidade  -> typecheck e lint BLOQUEIAM, erros E warnings.
#
#                 O typecheck estava em 39 erros e foi ZERADO em 21/08/2026,
#                 na mesma passada em que `strict` foi ligado (A13). Como a
#                 dívida acabou, ele deixou de ser informativo e passou a
#                 falhar: com baseline zero não existe "subiu um pouco", todo
#                 erro é novo. Era o que este comentário mandava fazer quando
#                 chegasse a zero.
#
#                 O lint dos ERROS também bloqueia desde 24/08/2026: os 101
#                 erros do A13 foram zerados, e com baseline zero não existe
#                 "subiu um pouco". Era o que este comentário mandava fazer.
#
#                 Os 6 WARNINGS de `react-hooks/exhaustive-deps` foram ZERADOS
#                 em 25/08/2026 e passaram a bloquear também. O receio anotado
#                 aqui era que bloquear empurrasse para o `eslint-disable`
#                 fácil; os seis caíram sem nenhum disable — cinco viraram
#                 `useCallback`/`useMemo` e um era guarda morta —, então o
#                 receio não se confirmou e a baseline pôde ir a zero. Se algum
#                 dia uma omissão for mesmo deliberada, o disable com
#                 justificativa na linha é resposta legítima; o que não pode é
#                 warning anônimo se acumulando sem ninguém decidir nada.
#
# Nota: `vite build` usa SWC e NÃO faz typecheck — o deploy da Vercel passa mesmo
# com erro de tipo. O job de typecheck aqui é a única visibilidade que existe.

on:
  pull_request:
  push:
    branches: [main]

# PR com vários pushes seguidos: cancela a rodada anterior em vez de enfileirar.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes (bloqueia o merge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Mesma major do ambiente de desenvolvimento (v20.20.2). O Vitest 4
          # exige ^20.19 || ^22.13 || >=24.
          #
          # Não confundir com a versão do RUNTIME DAS ACTIONS: o aviso de
          # depreciação que aparecia aqui era do `@v4` de checkout/setup-node,
          # que roda em Node 20 e o GitHub está aposentando — resolvido subindo
          # para `@v5`, que roda em Node 24. Este campo controla outra coisa: o
          # Node que executa npm, vitest e tsc. Ele fica em 20 de propósito,
          # para o CI rodar no mesmo Node da máquina.
          node-version: "20"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar a suíte
        run: npm test

  qualidade:
    name: Typecheck e Lint (bloqueiam)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Zerado em 21/08/2026 (A13). Sem baseline: qualquer erro derruba o job.
      - name: Typecheck
        id: typecheck
        run: |
          set -uo pipefail
          npx tsc -p tsconfig.app.json --noEmit > tsc.log 2>&1 || true
          total=$(grep -c "error TS" tsc.log || true)

          {
            echo "### Typecheck"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Erros | ${total} |"
            echo "| Permitido | 0 |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${total}" -gt 0 ]; then
            echo "| Situação | ❌ ${total} erro(s) de tipo |" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Typecheck falhou com ${total} erro(s). O projeto está em strict e a baseline é zero."
          else
            echo "| Situação | ✅ limpo |" >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo ""
            echo "<details><summary>Saída completa do tsc</summary>"
            echo ""
            echo '```'
            cat tsc.log
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          # Falha por último, para o resumo com a saída completa já estar
          # publicado quando o job ficar vermelho.
          [ "${total}" -eq 0 ]

      # Erros zerados em 24/08/2026 (A13) e warnings em 25/08/2026: sem
      # baseline dos dois lados, qualquer um derruba o job.
      - name: Lint
        id: lint
        run: |
          set -uo pipefail
          npx eslint . -f json -o eslint.json > /dev/null 2>&1 || true

          # Conta pelo JSON em vez da linha de resumo do eslint: o formato de
          # texto muda entre versões e depende de locale.
          read -r erros warnings < <(node -e '
            const r = require("./eslint.json");
            const e = r.reduce((a, f) => a + f.errorCount, 0);
            const w = r.reduce((a, f) => a + f.warningCount, 0);
            console.log(e, w);
          ')

          {
            echo "### Lint"
            echo ""
            echo "| | Agora | Permitido |"
            echo "|---|---|---|"
            echo "| Erros | ${erros} | 0 |"
            echo "| Warnings | ${warnings} | 0 |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${erros}" -gt 0 ]; then
            echo "::error::Lint falhou com ${erros} erro(s). A baseline é zero desde o A13."
            npx eslint . || true
          fi

          if [ "${warnings}" -gt 0 ]; then
            echo "::error::Lint falhou com ${warnings} warning(s). A baseline é zero desde 25/08/2026."
            npx eslint . || true
          fi

          # Falha por último, com o resumo já publicado.
          [ "${erros}" -eq 0 ] && [ "${warnings}" -eq 0 ]
