# User-bound functions: platform-level JWT verification (R7/R17).
# Each function still re-validates JWT internally and extracts claims, but
# unauthenticated requests are now rejected at the edge before any code runs
# (fail-closed early).

[functions.parse-invoice]
verify_jwt = true

[functions.migrate-installments]
verify_jwt = true

# admin-reset-password foi REMOVIDA (auditoria C1).
# Ela permitia que qualquer usuário autenticado redefinisse a senha de outro:
# add-member criava shared_access sem consentimento do alvo, e a autorização do
# reset olhava só para owner_id = quem chamou. Recuperação de senha agora é só
# pelo fluxo próprio do usuário (/forgot-password -> e-mail -> /reset-password).
# Se ela já foi deployada, apague no painel: Edge Functions > admin-reset-password.

[functions.add-member]
verify_jwt = true

# 2FA / MFA recovery flow (feature/mfa-totp).
# Both functions re-validate the JWT internally and additionally enforce
# AAL claims:
#   - mfa-recovery-generate: requires aal2 (post-TOTP)
#   - mfa-recovery-verify:   requires aal1 (post-password, pre-TOTP)

[functions.mfa-recovery-generate]
verify_jwt = true

[functions.mfa-recovery-verify]
verify_jwt = true

# Pluggy integration disabled during the Vercel migration (Phase 5).
# Both functions stay in the repo but are NOT deployed. Re-enable by
# uncommenting and running `supabase functions deploy pluggy-{connect,webhook}`.
# [functions.pluggy-connect]
# verify_jwt = true
#
# pluggy-webhook is server-to-server from Pluggy and authenticates via
# shared-secret header + optional HMAC (see supabase/functions/pluggy-webhook).
# JWT is intentionally disabled — HMAC/secret replaces it (R16).
# [functions.pluggy-webhook]
# verify_jwt = false
